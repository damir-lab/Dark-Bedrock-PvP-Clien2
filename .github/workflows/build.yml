
name: Build DarkBedrockPvP DLL

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.cpp"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build DLL
        shell: cmd
        run: |
          cl /nologo /EHsc /LD /std:c++17 /DUNICODE /D_UNICODE "dark_bedrock_pvp_client_autobuild\dark_bedrock_pvp_client\src\DarkBedrockPvPHud.cpp" user32.lib gdi32.lib /Fe:DarkBedrockPvPHud.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: DarkBedrockPvP-DLL
          path: DarkBedrockPvPHud.dll
