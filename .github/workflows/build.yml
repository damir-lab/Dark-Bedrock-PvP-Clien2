
name: Build DarkBedrockPvP DLL

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "**/*.cpp"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build DLL
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /EHsc /LD /std:c++17 /DUNICODE /D_UNICODE src\DarkBedrockPvPHud.cpp user32.lib gdi32.lib /Fe:DarkBedrockPvPHud.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: DarkBedrockPvP-DLL
          path: DarkBedrockPvPHud.dll
